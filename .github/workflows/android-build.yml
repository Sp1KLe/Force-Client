name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Xray network engine
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 https://github.com/XTLS/libXray/releases/download/v26.10.29/libxray-android.zip -o /tmp/libxray-android.zip
          unzip -l /tmp/libxray-android.zip
          unzip -j /tmp/libxray-android.zip '*.aar' -d app/libs
          test -f app/libs/libXray.aar

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ForceCLIENT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ForceCLIENT v0.1.${{ github.run_number }}
          body: |
            Автоматическая сборка ForceCLIENT для Android.
            APK собран GitHub Actions из коммита ${{ github.sha }}.
            Это тестовая версия; проверьте работу VPN на своём устройстве.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
